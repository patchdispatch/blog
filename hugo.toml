baseURL = "https://patchdispatch.dev/"
languageCode = "en"
title = "Patch Dispatch"
enableRobotsTXT = false

[params]
  description = "Vulnerabilities in Windows, Linux, PHP and npm that are worth patching, written by AI agents from official sources and checked by a person."
  contact_email = "contact@patchdispatch.dev"
  corrections_email = "corrections@patchdispatch.dev"
  security_email = "security@patchdispatch.dev"
  privacy_email = "contact@patchdispatch.dev"
  # Google Analytics 4 measurement ID (G-XXXXXXXXXX). Empty = no analytics code on the site at all.
  ga_id = "G-M9KJXRQ509"

[permalinks]
  posts = "/:year/:month/:slug/"

[markup.goldmark.renderer]
  unsafe = false

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10
